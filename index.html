<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kinetic Strings & Percussion</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #12141c;
      --text: #c5c6c7;
      --accent: #66fcf1;
      --accent-dim: #45a29e;
      --drum-color: #ff6b6b;
      --staff-line: rgba(255, 255, 255, 0.18);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Minimal Floating HUD */
    #hud {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 0;
      right: 0;
      margin: 0 auto;
      width: max-content;
      max-width: calc(100% - 24px);
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      background: rgba(18, 20, 28, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      align-items: center;
    }

    button {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    button:hover,
    button:focus-visible {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      outline: none;
    }

    .hint {
      opacity: 0.6;
      padding: 0 8px;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .hint { display: none; }
    }

    #stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>

  <div id="hud">
    <span class="hint">Strum strings, click drums, or let orbs collide</span>
    <button id="addOrbBtn">+ Kinetic Orb</button>
    <button id="clearOrbsBtn">Clear Orbs</button>
    <button id="clearSheetBtn">Clear Staff</button>
  </div>

  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    // Layout state (CSS pixels; the backing store is scaled by devicePixelRatio)
    let width = 0;
    let height = 0;
    let staffAreaHeight = 195;
    let playAreaHeight = 0;
    let playTop = 0; // keeps strings and drums clear of the floating HUD

    // Web Audio API Context, created on the first user gesture
    let audioCtx = null;
    let masterBus = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Compressor keeps fast strums and drum rolls from clipping
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.setValueAtTime(-14, audioCtx.currentTime);
        comp.knee.setValueAtTime(10, audioCtx.currentTime);
        comp.ratio.setValueAtTime(6, audioCtx.currentTime);
        comp.attack.setValueAtTime(0.003, audioCtx.currentTime);
        comp.release.setValueAtTime(0.2, audioCtx.currentTime);
        masterBus = audioCtx.createGain();
        masterBus.gain.setValueAtTime(0.8, audioCtx.currentTime);
        masterBus.connect(comp);
        comp.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Orbs can fire before anyone has interacted; stay silent until audio is unlocked
    function audioReady() {
      return audioCtx && audioCtx.state === 'running';
    }

    // --- SOUND SYNTHESIS ---
    function playGuitarSound(freq) {
      if (!audioReady()) return;
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 1.002, now); // Slight detune for warmth

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(freq * 6, now);
      filter.frequency.exponentialRampToValueAtTime(freq * 1.2, now + 1.1);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.6);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(masterBus);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 1.65);
      osc2.stop(now + 1.65);
    }

    function noiseBuffer(seconds) {
      const bufferSize = Math.floor(audioCtx.sampleRate * seconds);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }

    function playDrumSound(type) {
      if (!audioReady()) return;
      const now = audioCtx.currentTime;

      if (type === 'kick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.35);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(masterBus);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'snare') {
        // Noise burst
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer(0.2);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(700, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(masterBus);
        noise.start(now);

        // Body tone
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        oscGain.gain.setValueAtTime(0.25, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(oscGain);
        oscGain.connect(masterBus);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'hihat') {
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer(0.08);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(6000, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(masterBus);
        noise.start(now);
      } else if (type === 'tom') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.exponentialRampToValueAtTime(85, now + 0.28);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(masterBus);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // --- MUSICAL DATA & SHEET NOTATION ---
    // Standard Treble Staff positions (steps relative to bottom line E4 = 0)
    // E4 = 0, F4 = 1, G4 = 2, A4 = 3, B4 = 4, C5 = 5, D5 = 6, E5 = 7, F5 = 8
    const guitarDefs = [
      { name: 'E4', freq: 329.63, staffStep: 0, color: '#66fcf1' },
      { name: 'B3', freq: 246.94, staffStep: -3, color: '#56e3d8' },
      { name: 'G3', freq: 196.00, staffStep: -5, color: '#45c9c0' },
      { name: 'D3', freq: 146.83, staffStep: -8, color: '#38b0a8' },
      { name: 'A2', freq: 110.00, staffStep: -11, color: '#2b968f' },
      { name: 'E2', freq: 82.41,  staffStep: -14, color: '#1f7d77' }
    ];

    const drumDefs = [
      { name: 'Hi-Hat', type: 'hihat', staffStep: 9, shape: 'triangle', color: '#ffd166', isDrum: true },
      { name: 'Tom',    type: 'tom',   staffStep: 6, shape: 'hexagon',  color: '#06d6a0', isDrum: true },
      { name: 'Snare',  type: 'snare', staffStep: 4, shape: 'square',   color: '#ff6b6b', isDrum: true },
      { name: 'Kick',   type: 'kick',  staffStep: 0, shape: 'circle',   color: '#f78c6b', isDrum: true }
    ];

    const SCROLL_SPEED = 1.6;   // px per 60fps frame
    const NOTE_SPACING = 16;    // minimum gap between consecutive notes on the staff

    let sheetNotes = [];
    let strings = [];
    let drums = [];
    let orbs = [];

    function playheadX() {
      return width - 90;
    }

    function addSheetNote(def) {
      // New notes land on the playhead; if the previous note is still too close,
      // push the earlier notes left so fast strums stay readable
      const x = playheadX();
      const last = sheetNotes[sheetNotes.length - 1];
      if (last && last.x > x - NOTE_SPACING) {
        const shift = last.x - (x - NOTE_SPACING);
        sheetNotes.forEach(n => { n.x -= shift; });
      }
      sheetNotes.push({
        name: def.name,
        staffStep: def.staffStep,
        color: def.color,
        isDrum: !!def.isDrum,
        x
      });
      if (sheetNotes.length > 120) sheetNotes.shift();
    }

    // --- BUILD SCENE GEOMETRY ---
    function setupLayout() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      width = rect.width;
      height = rect.height;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      staffAreaHeight = 195;
      playAreaHeight = height - staffAreaHeight;
      const hud = document.getElementById('hud').getBoundingClientRect();
      playTop = hud.bottom + 24;

      const usable = Math.max(playAreaHeight - playTop - 30, 120);
      const narrow = width < 700 || width < height * 0.9;

      if (narrow) {
        // Phones / portrait: strings across the top, drums in a row below
        const stringsBottom = playTop + usable * 0.62;
        strings = guitarDefs.map((def, i) => ({
          ...def,
          x1: Math.max(44, width * 0.12),
          x2: width - Math.max(20, width * 0.06),
          y: playTop + 10 + i * ((stringsBottom - playTop - 10) / 5),
          amp: 0,
          vel: 0
        }));

        const r = Math.min(width / 10, usable * 0.14, 46);
        const drumY = stringsBottom + (playAreaHeight - stringsBottom) / 2;
        drums = drumDefs.map((def, i) => ({
          ...def,
          x: width * (0.125 + i * 0.25),
          y: drumY,
          r,
          pulse: 0,
          lastHit: 0
        }));
      } else {
        // 6 Guitar Strings on the left half
        strings = guitarDefs.map((def, i) => ({
          ...def,
          x1: Math.max(44, width * 0.08),
          x2: width * 0.52,
          y: playTop + 10 + i * ((usable - 20) / 5),
          amp: 0,
          vel: 0
        }));

        // 4 Drum Shapes on the right half
        const r = Math.min(width * 0.055, usable * 0.2);
        drums = drumDefs.map((def, i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          return {
            ...def,
            x: width * 0.68 + col * (width * 0.16),
            y: playTop + r + 10 + row * Math.max(usable - 2 * r - 20, 0),
            r,
            pulse: 0,
            lastHit: 0
          };
        });
      }

      // Keep existing orbs inside the resized play area
      orbs.forEach(orb => {
        orb.x = Math.max(orb.r, Math.min(width - orb.r, orb.x));
        orb.y = Math.max(orb.r, Math.min(playAreaHeight - orb.r, orb.y));
        orb.px = orb.x;
        orb.py = orb.y;
        orb.trail = [];
      });
    }

    window.addEventListener('resize', setupLayout);
    setupLayout();

    // --- KINETIC ORBS ---
    function spawnOrb(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4.2 + Math.random() * 2.5;
      const ox = x ?? width * 0.5;
      const oy = y ?? playAreaHeight * 0.45;
      orbs.push({
        x: ox,
        y: oy,
        px: ox,
        py: oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 9,
        trail: []
      });
    }

    // Spawn 2 initial kinetic orbs
    spawnOrb(width * 0.3, playAreaHeight * 0.35);
    spawnOrb(width * 0.74, playAreaHeight * 0.5);

    // --- TRIGGER HELPERS ---
    function triggerString(s, velocity = 22) {
      s.amp = Math.max(-35, Math.min(35, velocity));
      playGuitarSound(s.freq);
      addSheetNote(s);
    }

    function triggerDrum(d) {
      d.pulse = 1.0;
      d.lastHit = performance.now();
      playDrumSound(d.type);
      addSheetNote(d);
    }

    // --- INTERACTION (MOUSE / TOUCH) ---
    let pointer = { x: 0, y: 0, px: 0, py: 0, active: false };

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      initAudio();
      const p = canvasPoint(e);
      pointer.x = pointer.px = p.x;
      pointer.y = pointer.py = p.y;
      pointer.active = true;

      // Tap directly on a string to pluck it
      strings.forEach(s => {
        if (p.x >= s.x1 && p.x <= s.x2 && Math.abs(p.y - s.y) <= 12) {
          triggerString(s, 18);
        }
      });

      // Check direct click on drum shape
      drums.forEach(d => {
        const dist = Math.hypot(p.x - d.x, p.y - d.y);
        if (dist <= d.r * 1.15) {
          triggerDrum(d);
        }
      });
    });

    canvas.addEventListener('pointermove', (e) => {
      const p = canvasPoint(e);
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      pointer.x = p.x;
      pointer.y = p.y;

      // Strum strings by moving across them
      strings.forEach(s => {
        if (pointer.x >= s.x1 && pointer.x <= s.x2) {
          const crossedDown = pointer.py < s.y && pointer.y >= s.y;
          const crossedUp = pointer.py > s.y && pointer.y <= s.y;
          if (crossedDown || crossedUp) {
            const dy = pointer.y - pointer.py;
            triggerString(s, dy === 0 ? 18 : dy);
          }
        }
      });

      // Swipe across drum edges (only while pressed, so a plain click doesn't hit twice)
      if (!pointer.active) return;
      drums.forEach(d => {
        const prevDist = Math.hypot(pointer.px - d.x, pointer.py - d.y);
        const currDist = Math.hypot(pointer.x - d.x, pointer.y - d.y);
        if (prevDist > d.r && currDist <= d.r) {
          triggerDrum(d);
        }
      });
    });

    window.addEventListener('pointercancel', () => {
      pointer.active = false;
    });

    window.addEventListener('pointerup', () => {
      pointer.active = false;
    });

    // UI Buttons
    document.getElementById('addOrbBtn').addEventListener('click', () => {
      initAudio();
      spawnOrb(width * (0.25 + Math.random() * 0.5), playAreaHeight * (0.25 + Math.random() * 0.5));
    });

    document.getElementById('clearOrbsBtn').addEventListener('click', () => {
      orbs = [];
    });

    document.getElementById('clearSheetBtn').addEventListener('click', () => {
      sheetNotes = [];
    });

    // --- DRAWING SHAPES ---
    function drawPolygon(cx, cy, r, sides, rotation = 0) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const a = rotation + (i * 2 * Math.PI) / sides;
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    // --- MAIN ANIMATION LOOP ---
    let lastFrame = performance.now();

    function animate(now = performance.now()) {
      // Normalise to 60fps steps so 120Hz screens don't run double speed;
      // clamp so a backgrounded tab doesn't jump on return
      const dt = Math.min((now - lastFrame) / (1000 / 60), 3);
      lastFrame = now;

      ctx.clearRect(0, 0, width, height);

      // 1. Update & Draw Guitar Strings
      strings.forEach(s => {
        // Spring harmonic decay
        const stiffness = 0.28;
        const damping = Math.pow(0.90, dt);
        const force = -stiffness * s.amp;
        s.vel = (s.vel + force * dt) * damping;
        s.amp += s.vel * dt;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y);
        ctx.quadraticCurveTo((s.x1 + s.x2) / 2, s.y + s.amp, s.x2, s.y);
        ctx.strokeStyle = Math.abs(s.amp) > 0.8 ? s.color : 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = Math.abs(s.amp) > 0.8 ? 3 : 1.5;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = Math.min(Math.abs(s.amp) * 1.2, 18);
        ctx.stroke();

        // String end pins + note label
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.font = '11px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(s.name, s.x1 - 10, s.y + 4);
        ctx.beginPath();
        ctx.arc(s.x1, s.y, 3, 0, Math.PI * 2);
        ctx.arc(s.x2, s.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 2. Update & Draw Drum Shapes
      drums.forEach(d => {
        d.pulse *= Math.pow(0.88, dt);
        const currentR = d.r + d.pulse * 12;

        ctx.save();
        ctx.strokeStyle = d.color;
        ctx.lineWidth = 2 + d.pulse * 3;
        ctx.fillStyle = `rgba(255, 255, 255, ${0.03 + d.pulse * 0.22})`;
        ctx.shadowColor = d.color;
        ctx.shadowBlur = d.pulse * 24;

        if (d.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(d.x, d.y, currentR, 0, Math.PI * 2);
        } else if (d.shape === 'square') {
          drawPolygon(d.x, d.y, currentR, 4, Math.PI / 4);
        } else if (d.shape === 'triangle') {
          drawPolygon(d.x, d.y, currentR, 3, -Math.PI / 2);
        } else if (d.shape === 'hexagon') {
          drawPolygon(d.x, d.y, currentR, 6, 0);
        }
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = (d.r < 36 ? '9px' : '11px') + ' monospace';
        ctx.textAlign = 'center';
        // Triangle label sits lower, where the shape is wide enough for it
        const labelY = d.shape === 'triangle' ? d.y + d.r * 0.3 + 4 : d.y + 4;
        ctx.fillText(d.name.toUpperCase(), d.x, labelY);
        ctx.restore();
      });

      // 3. Update & Draw Kinetic Orbs
      orbs.forEach(orb => {
        orb.px = orb.x;
        orb.py = orb.y;
        orb.x += orb.vx * dt;
        orb.y += orb.vy * dt;

        // Bounce off walls of play area
        if (orb.x - orb.r < 0 || orb.x + orb.r > width) {
          orb.vx = orb.x - orb.r < 0 ? Math.abs(orb.vx) : -Math.abs(orb.vx);
          orb.x = Math.max(orb.r, Math.min(width - orb.r, orb.x));
        }
        if (orb.y - orb.r < 0 || orb.y + orb.r > playAreaHeight) {
          orb.vy = orb.y - orb.r < 0 ? Math.abs(orb.vy) : -Math.abs(orb.vy);
          orb.y = Math.max(orb.r, Math.min(playAreaHeight - orb.r, orb.y));
        }

        // Check string crossings
        strings.forEach(s => {
          if (orb.x >= s.x1 && orb.x <= s.x2) {
            const crossedDown = orb.py < s.y && orb.y >= s.y;
            const crossedUp = orb.py > s.y && orb.y <= s.y;
            if (crossedDown || crossedUp) {
              triggerString(s, orb.vy * 5);
            }
          }
        });

        // Check drum collisions
        drums.forEach(d => {
          const dx = orb.x - d.x;
          const dy = orb.y - d.y;
          const dist = Math.hypot(dx, dy);
          if (dist < d.r + orb.r) {
            // Reflect velocity vector off drum normal (pick any normal if dead centre)
            const nx = dist > 0 ? dx / dist : 1;
            const ny = dist > 0 ? dy / dist : 0;
            const dot = orb.vx * nx + orb.vy * ny;
            if (dot < 0) {
              orb.vx = orb.vx - 2 * dot * nx;
              orb.vy = orb.vy - 2 * dot * ny;
            }
            // Push orb outside boundary
            orb.x = d.x + nx * (d.r + orb.r + 2);
            orb.y = d.y + ny * (d.r + orb.r + 2);
            // Short cooldown so an orb pinned against a wall doesn't machine-gun the drum
            if (performance.now() - d.lastHit > 80) {
              triggerDrum(d);
            }
          }
        });

        // Record motion trail
        orb.trail.push({ x: orb.x, y: orb.y });
        if (orb.trail.length > 14) orb.trail.shift();

        // Draw trail
        ctx.beginPath();
        orb.trail.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.strokeStyle = 'rgba(102, 252, 241, 0.25)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw orb
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#66fcf1';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 4. Draw Bottom Sheet Music Staff
      drawSheetMusic(dt);

      requestAnimationFrame(animate);
    }

    function drawSheetMusic(dt) {
      const staffTop = height - staffAreaHeight + 35;
      const lineSpacing = 12; // 12px between staff lines (6px per diatonic step)
      const stepSize = lineSpacing / 2;
      const bottomLineY = staffTop + 4 * lineSpacing; // E4 line
      const labelY = height - 8;
      const head = playheadX();

      // Background panel for sheet music
      ctx.fillStyle = 'rgba(14, 16, 23, 0.95)';
      ctx.fillRect(0, height - staffAreaHeight, width, staffAreaHeight);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, height - staffAreaHeight);
      ctx.lineTo(width, height - staffAreaHeight);
      ctx.stroke();

      // 5 Staff Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      for (let i = 0; i < 5; i++) {
        const y = staffTop + i * lineSpacing;
        ctx.beginPath();
        ctx.moveTo(40, y);
        ctx.lineTo(width - 40, y);
        ctx.stroke();
      }

      // Treble Clef Symbol
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.font = '46px serif';
      ctx.textAlign = 'left';
      ctx.fillText('𝄞', 48, bottomLineY - 4);

      // Playhead marker on right
      ctx.strokeStyle = 'rgba(102, 252, 241, 0.25)';
      ctx.beginPath();
      ctx.moveTo(head, staffTop - 15);
      ctx.lineTo(head, labelY - 14);
      ctx.stroke();

      // Scroll & Render Notes
      for (let i = sheetNotes.length - 1; i >= 0; i--) {
        const n = sheetNotes[i];
        n.x -= SCROLL_SPEED * dt; // Scroll left

        if (n.x < 95) {
          sheetNotes.splice(i, 1);
          continue;
        }
        const noteY = bottomLineY - n.staffStep * stepSize;

        ctx.save();
        ctx.strokeStyle = n.color;
        ctx.fillStyle = n.color;
        ctx.lineWidth = 1.6;

        // Draw Ledger Lines if below E4 (staffStep < 0) or above F5 (staffStep > 8)
        if (n.staffStep <= -2) {
          for (let step = -2; step >= n.staffStep; step -= 2) {
            const ly = bottomLineY - step * stepSize;
            ctx.beginPath();
            ctx.moveTo(n.x - 10, ly);
            ctx.lineTo(n.x + 10, ly);
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.stroke();
          }
        } else if (n.staffStep >= 10) {
          for (let step = 10; step <= n.staffStep; step += 2) {
            const ly = bottomLineY - step * stepSize;
            ctx.beginPath();
            ctx.moveTo(n.x - 10, ly);
            ctx.lineTo(n.x + 10, ly);
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.stroke();
          }
        }

        ctx.strokeStyle = n.color;
        if (n.isDrum) {
          // Percussion 'X' notehead
          const s = 4.5;
          ctx.beginPath();
          ctx.moveTo(n.x - s, noteY - s);
          ctx.lineTo(n.x + s, noteY + s);
          ctx.moveTo(n.x + s, noteY - s);
          ctx.lineTo(n.x - s, noteY + s);
          ctx.stroke();
        } else {
          // Tilted oval notehead for guitar
          ctx.beginPath();
          ctx.ellipse(n.x, noteY, 5.5, 4, -0.35, 0, Math.PI * 2);
          ctx.fill();
        }

        // Note stem
        ctx.beginPath();
        if (n.staffStep < 4) {
          ctx.moveTo(n.x + 5, noteY);
          ctx.lineTo(n.x + 5, noteY - 26);
        } else {
          ctx.moveTo(n.x - 5, noteY);
          ctx.lineTo(n.x - 5, noteY + 26);
        }
        ctx.stroke();

        // Subtle note label along the bottom edge, clear of the ledger lines
        ctx.font = '9px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.textAlign = 'center';
        ctx.fillText(n.isDrum ? n.name[0] : n.name, n.x, labelY);
        ctx.restore();
      }
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
