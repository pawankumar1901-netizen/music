<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetic Strings & Percussion</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #12141c;
      --text: #c5c6c7;
      --accent: #66fcf1;
      --accent-dim: #45a29e;
      --drum-color: #ff6b6b;
      --staff-line: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* Minimal Floating HUD */
    #hud {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(18, 20, 28, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      align-items: center;
    }

    button {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .hint {
      opacity: 0.6;
      padding: 0 8px;
      font-size: 12px;
    }

    #stage {
      flex: 1;
      width: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>

  <div id="hud">
    <span class="hint">Strum strings, click drums, or let orbs collide</span>
    <button id="addOrbBtn">+ Kinetic Orb</button>
    <button id="clearOrbsBtn">Clear Orbs</button>
    <button id="clearSheetBtn">Clear Staff</button>
  </div>

  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    // Layout constants
    let staffAreaHeight = 190;
    let playAreaHeight = height - staffAreaHeight;

    // Web Audio API Context
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // --- SOUND SYNTHESIS ---
    function playGuitarSound(freq) {
      initAudio();
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc1.type = 'triangle';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 1.002, now); // Slight detune for warmth

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(freq * 6, now);
      filter.frequency.exponentialRampToValueAtTime(freq * 1.2, now + 1.1);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.6);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 1.65);
      osc2.stop(now + 1.65);
    }

    function playDrumSound(type) {
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'kick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.35);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'snare') {
        // Noise burst
        const bufferSize = audioCtx.sampleRate * 0.2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(700, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);

        // Body tone
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        oscGain.gain.setValueAtTime(0.25, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'hihat') {
        const bufferSize = audioCtx.sampleRate * 0.08;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(6000, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'tom') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(210, now);
        osc.frequency.exponentialRampToValueAtTime(85, now + 0.28);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }

    // --- MUSICAL DATA & SHEET NOTATION ---
    // Standard Treble Staff positions (steps relative to bottom line E4 = 0)
    // E4 = 0, F4 = 1, G4 = 2, A4 = 3, B4 = 4, C5 = 5, D5 = 6, E5 = 7, F5 = 8
    const guitarDefs = [
      { name: 'E4', freq: 329.63, staffStep: 0, color: '#66fcf1' },
      { name: 'B3', freq: 246.94, staffStep: -3, color: '#56e3d8' },
      { name: 'G3', freq: 196.00, staffStep: -5, color: '#45c9c0' },
      { name: 'D3', freq: 146.83, staffStep: -8, color: '#38b0a8' },
      { name: 'A2', freq: 110.00, staffStep: -11, color: '#2b968f' },
      { name: 'E2', freq: 82.41,  staffStep: -14, color: '#1f7d77' }
    ];

    const drumDefs = [
      { name: 'Hi-Hat', type: 'hihat', staffStep: 9, shape: 'triangle', color: '#ffd166', isDrum: true },
      { name: 'Tom',    type: 'tom',   staffStep: 6, shape: 'hexagon',  color: '#06d6a0', isDrum: true },
      { name: 'Snare',  type: 'snare', staffStep: 4, shape: 'square',   color: '#ff6b6b', isDrum: true },
      { name: 'Kick',   type: 'kick',  staffStep: 0, shape: 'circle',   color: '#f78c6b', isDrum: true }
    ];

    let sheetNotes = [];
    let strings = [];
    let drums = [];
    let orbs = [];

    function addSheetNote(def) {
      sheetNotes.push({
        name: def.name,
        staffStep: def.staffStep,
        color: def.color,
        isDrum: !!def.isDrum,
        x: width - 90,
        alpha: 1,
        born: performance.now()
      });
      if (sheetNotes.length > 80) sheetNotes.shift();
    }

    // --- BUILD SCENE GEOMETRY ---
    function setupLayout() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      staffAreaHeight = 195;
      playAreaHeight = height - staffAreaHeight;

      // 6 Guitar Strings on the left half
      strings = guitarDefs.map((def, i) => {
        const y = 100 + i * ((playAreaHeight - 170) / 5);
        return {
          ...def,
          x1: width * 0.08,
          x2: width * 0.52,
          y: y,
          amp: 0,
          vel: 0
        };
      });

      // 4 Drum Shapes on the right half
      const cols = 2;
      drums = drumDefs.map((def, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx = width * 0.68 + col * (width * 0.16);
        const cy = 140 + row * ((playAreaHeight - 240));
        return {
          ...def,
          x: cx,
          y: cy,
          r: Math.min(width, height) * 0.055,
          pulse: 0
        };
      });
    }

    window.addEventListener('resize', setupLayout);
    setupLayout();

    // --- KINETIC ORBS ---
    function spawnOrb(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4.2 + Math.random() * 2.5;
      orbs.push({
        x: x ?? width * 0.5,
        y: y ?? playAreaHeight * 0.45,
        px: x ?? width * 0.5,
        py: y ?? playAreaHeight * 0.45,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 9,
        trail: []
      });
    }

    // Spawn 2 initial kinetic orbs
    spawnOrb(width * 0.3, playAreaHeight * 0.35);
    spawnOrb(width * 0.74, playAreaHeight * 0.5);

    // --- TRIGGER HELPERS ---
    function triggerString(s, velocity = 22) {
      s.amp = velocity;
      playGuitarSound(s.freq);
      addSheetNote(s);
    }

    function triggerDrum(d) {
      d.pulse = 1.0;
      playDrumSound(d.type);
      addSheetNote(d);
    }

    // --- INTERACTION (MOUSE / TOUCH) ---
    let pointer = { x: 0, y: 0, px: 0, py: 0, active: false };

    window.addEventListener('pointerdown', (e) => {
      initAudio();
      pointer.x = pointer.px = e.clientX;
      pointer.y = pointer.py = e.clientY;
      pointer.active = true;

      // Check direct click on drum shape
      drums.forEach(d => {
        const dist = Math.hypot(pointer.x - d.x, pointer.y - d.y);
        if (dist <= d.r * 1.15) {
          triggerDrum(d);
        }
      });
    });

    window.addEventListener('pointermove', (e) => {
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      pointer.x = e.clientX;
      pointer.y = e.clientY;

      // Strum strings by moving across them
      strings.forEach(s => {
        if (pointer.x >= s.x1 && pointer.x <= s.x2) {
          const crossedDown = pointer.py < s.y && pointer.y >= s.y;
          const crossedUp = pointer.py > s.y && pointer.y <= s.y;
          if (crossedDown || crossedUp) {
            const dy = Math.min(Math.max(pointer.y - pointer.py, -35), 35);
            triggerString(s, dy === 0 ? 18 : dy);
          }
        }
      });

      // Swipe across drum edges
      drums.forEach(d => {
        const prevDist = Math.hypot(pointer.px - d.x, pointer.py - d.y);
        const currDist = Math.hypot(pointer.x - d.x, pointer.y - d.y);
        if (prevDist > d.r && currDist <= d.r) {
          triggerDrum(d);
        }
      });
    });

    window.addEventListener('pointerup', () => {
      pointer.active = false;
    });

    // UI Buttons
    document.getElementById('addOrbBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      spawnOrb(width * (0.25 + Math.random() * 0.5), playAreaHeight * (0.25 + Math.random() * 0.5));
    });

    document.getElementById('clearOrbsBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      orbs = [];
    });

    document.getElementById('clearSheetBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      sheetNotes = [];
    });

    // --- DRAWING SHAPES ---
    function drawPolygon(cx, cy, r, sides, rotation = 0) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const a = rotation + (i * 2 * Math.PI) / sides;
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    // --- MAIN ANIMATION LOOP ---
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Update & Draw Guitar Strings
      strings.forEach(s => {
        // Spring harmonic decay
        const stiffness = 0.28;
        const damping = 0.90;
        const force = -stiffness * s.amp;
        s.vel = (s.vel + force) * damping;
        s.amp += s.vel;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y);
        ctx.quadraticCurveTo((s.x1 + s.x2) / 2, s.y + s.amp, s.x2, s.y);
        ctx.strokeStyle = Math.abs(s.amp) > 0.8 ? s.color : 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = Math.abs(s.amp) > 0.8 ? 3 : 1.5;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = Math.min(Math.abs(s.amp) * 1.2, 18);
        ctx.stroke();

        // String end pins + note label
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.font = '11px monospace';
        ctx.fillText(s.name, s.x1 - 28, s.y + 4);
        ctx.beginPath();
        ctx.arc(s.x1, s.y, 3, 0, Math.PI * 2);
        ctx.arc(s.x2, s.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 2. Update & Draw Drum Shapes
      drums.forEach(d => {
        d.pulse *= 0.88;
        const currentR = d.r + d.pulse * 12;

        ctx.save();
        ctx.strokeStyle = d.color;
        ctx.lineWidth = 2 + d.pulse * 3;
        ctx.fillStyle = `rgba(255, 255, 255, ${0.03 + d.pulse * 0.22})`;
        ctx.shadowColor = d.color;
        ctx.shadowBlur = d.pulse * 24;

        if (d.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(d.x, d.y, currentR, 0, Math.PI * 2);
        } else if (d.shape === 'square') {
          drawPolygon(d.x, d.y, currentR, 4, Math.PI / 4);
        } else if (d.shape === 'triangle') {
          drawPolygon(d.x, d.y, currentR, 3, -Math.PI / 2);
        } else if (d.shape === 'hexagon') {
          drawPolygon(d.x, d.y, currentR, 6, 0);
        }
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = '11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(d.name.toUpperCase(), d.x, d.y + 4);
        ctx.restore();
      });

      // 3. Update & Draw Kinetic Orbs
      orbs.forEach(orb => {
        orb.px = orb.x;
        orb.py = orb.y;
        orb.x += orb.vx;
        orb.y += orb.vy;

        // Bounce off walls of play area
        if (orb.x - orb.r < 0 || orb.x + orb.r > width) {
          orb.vx *= -1;
          orb.x = Math.max(orb.r, Math.min(width - orb.r, orb.x));
        }
        if (orb.y - orb.r < 0 || orb.y + orb.r > playAreaHeight) {
          orb.vy *= -1;
          orb.y = Math.max(orb.r, Math.min(playAreaHeight - orb.r, orb.y));
        }

        // Check string crossings
        strings.forEach(s => {
          if (orb.x >= s.x1 && orb.x <= s.x2) {
            const crossedDown = orb.py < s.y && orb.y >= s.y;
            const crossedUp = orb.py > s.y && orb.y <= s.y;
            if (crossedDown || crossedUp) {
              triggerString(s, orb.vy * 5);
            }
          }
        });

        // Check drum collisions
        drums.forEach(d => {
          const dx = orb.x - d.x;
          const dy = orb.y - d.y;
          const dist = Math.hypot(dx, dy);
          if (dist < d.r + orb.r) {
            // Reflect velocity vector off drum normal
            const nx = dx / dist;
            const ny = dy / dist;
            const dot = orb.vx * nx + orb.vy * ny;
            orb.vx = orb.vx - 2 * dot * nx;
            orb.vy = orb.vy - 2 * dot * ny;
            // Push orb outside boundary
            orb.x = d.x + nx * (d.r + orb.r + 2);
            orb.y = d.y + ny * (d.r + orb.r + 2);
            triggerDrum(d);
          }
        });

        // Record motion trail
        orb.trail.push({ x: orb.x, y: orb.y });
        if (orb.trail.length > 14) orb.trail.shift();

        // Draw trail
        ctx.beginPath();
        orb.trail.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.strokeStyle = 'rgba(102, 252, 241, 0.25)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw orb
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#66fcf1';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 4. Draw Bottom Sheet Music Staff
      drawSheetMusic();

      requestAnimationFrame(animate);
    }

    function drawSheetMusic() {
      const staffTop = height - staffAreaHeight + 35;
      const lineSpacing = 12; // 12px between staff lines (6px per diatonic step)
      const stepSize = lineSpacing / 2;
      const bottomLineY = staffTop + 4 * lineSpacing; // E4 line

      // Background panel for sheet music
      ctx.fillStyle = 'rgba(14, 16, 23, 0.95)';
      ctx.fillRect(0, height - staffAreaHeight, width, staffAreaHeight);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.beginPath();
      ctx.moveTo(0, height - staffAreaHeight);
      ctx.lineTo(width, height - staffAreaHeight);
      ctx.stroke();

      // 5 Staff Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const y = staffTop + i * lineSpacing;
        ctx.beginPath();
        ctx.moveTo(40, y);
        ctx.lineTo(width - 40, y);
        ctx.stroke();
      }

      // Treble Clef Symbol
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.font = '46px serif';
      ctx.fillText('𝄞', 48, bottomLineY - 4);

      // Playhead marker on right
      ctx.strokeStyle = 'rgba(102, 252, 241, 0.25)';
      ctx.beginPath();
      ctx.moveTo(width - 90, staffTop - 15);
      ctx.lineTo(width - 90, bottomLineY + 45);
      ctx.stroke();

      // Scroll & Render Notes
      for (let i = sheetNotes.length - 1; i >= 0; i--) {
        const n = sheetNotes[i];
        n.x -= 1.6; // Scroll left

        if (n.x < 95) {
          sheetNotes.splice(i, 1);
          continue;
        }

        const noteY = bottomLineY - n.staffStep * stepSize;

        ctx.save();
        ctx.strokeStyle = n.color;
        ctx.fillStyle = n.color;
        ctx.lineWidth = 1.6;

        // Draw Ledger Lines if below E4 (staffStep < 0) or above F5 (staffStep > 8)
        if (n.staffStep <= -2) {
          for (let step = -2; step >= n.staffStep; step -= 2) {
            const ly = bottomLineY - step * stepSize;
            ctx.beginPath();
            ctx.moveTo(n.x - 10, ly);
            ctx.lineTo(n.x + 10, ly);
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.stroke();
          }
        } else if (n.staffStep >= 10) {
          for (let step = 10; step <= n.staffStep; step += 2) {
            const ly = bottomLineY - step * stepSize;
            ctx.beginPath();
            ctx.moveTo(n.x - 10, ly);
            ctx.lineTo(n.x + 10, ly);
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.stroke();
          }
        }

        ctx.strokeStyle = n.color;
        if (n.isDrum) {
          // Percussion 'X' notehead
          const s = 4.5;
          ctx.beginPath();
          ctx.moveTo(n.x - s, noteY - s);
          ctx.lineTo(n.x + s, noteY + s);
          ctx.moveTo(n.x + s, noteY - s);
          ctx.lineTo(n.x - s, noteY + s);
          ctx.stroke();
        } else {
          // Tilted oval notehead for guitar
          ctx.beginPath();
          ctx.ellipse(n.x, noteY, 5.5, 4, -0.35, 0, Math.PI * 2);
          ctx.fill();
        }

        // Note stem
        ctx.beginPath();
        if (n.staffStep < 4) {
          ctx.moveTo(n.x + 5, noteY);
          ctx.lineTo(n.x + 5, noteY - 26);
        } else {
          ctx.moveTo(n.x - 5, noteY);
          ctx.lineTo(n.x - 5, noteY + 26);
        }
        ctx.stroke();

        // Subtle note label underneath
        ctx.font = '9px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.textAlign = 'center';
        ctx.fillText(n.name, n.x, bottomLineY + 62);
        ctx.restore();
      }
    }

    animate();
  </script>
</body>
</html>
